# GPU overlay for the worker only. API/database/Ollama are not replaced.
services:
  worker:
    image: psptm-minutes:gpu
    build:
      context: .
      target: gpu
    environment:
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
