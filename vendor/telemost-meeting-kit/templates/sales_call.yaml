id: sales_call
name: Встреча с клиентом (продажа)
description: Квалификация сделки — гибрид BANT и MEDDIC (как шаблон MEDDIC в mymeet.ai), плюс возражения и следующие шаги.
when_to_use: Звонки и встречи с потенциальными и текущими клиентами, где обсуждается покупка или расширение.
sections:
  - title: Клиент и контекст
    format: list
    instruction: Компания, участники со стороны клиента и их роли, текущая ситуация, как пришли к разговору.
  - title: Боли и задачи клиента
    format: list
    instruction: Проблемы, которые клиент назвал сам, с цитатами и таймкодами. Цена проблемы (потери, затраты), если прозвучала.
  - title: Критерии успеха (Metrics)
    format: list
    instruction: Как клиент поймёт, что решение сработало — метрики и цифры, если назвали.
  - title: Принятие решения
    format: table
    columns: ["Параметр", "Что известно", "Таймкод"]
    instruction: >
      Строки: «ЛПР (Economic buyer)», «Кто влияет на решение», «Критерии выбора», «Процесс покупки и согласования»,
      «Бюджет», «Сроки», «Конкуренты и альтернативы», «Внутренний сторонник (Champion)».
      Если о параметре ничего не прозвучало — «не выяснено».
  - title: Возражения и сомнения
    format: table
    columns: ["Возражение", "Что ответили", "Снято?"]
    instruction: Все возражения клиента и как на них отреагировали.
  - title: Договорённости и следующие шаги
    format: table
    columns: ["Кто", "Что", "Срок"]
    instruction: Обязательства обеих сторон, дата следующего контакта.
  - title: Пробелы квалификации
    format: list
    instruction: Что важно выяснить на следующей встрече — строки из таблицы «Принятие решения» со значением «не выяснено».
  - title: Разбор работы продавца
    format: list
    instruction: >
      2–4 наблюдения по ходу звонка с таймкодами: где хорошо выявили потребность, где упустили вопрос
      или перебили клиента, сколько говорил продавец относительно клиента (если видно из транскрипта). Только факты из разговора.
