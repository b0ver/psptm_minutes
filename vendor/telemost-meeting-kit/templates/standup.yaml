id: standup
name: Стендап / дейли
description: Короткий командный синк по формату «сделал — делаю — блокеры».
when_to_use: Ежедневные и еженедельные короткие синки команды.
sections:
  - title: По участникам
    format: paragraph
    instruction: >
      Для каждого участника — «### Имя» и три пункта:
      **Сделано:** …; **В работе:** …; **Блокеры:** … (или «нет»).
      Только прозвучавшее от самого участника или про него.
  - title: Блокеры, требующие помощи
    format: table
    columns: ["Блокер", "У кого", "Кто может помочь", "Таймкод"]
    instruction: Все блокеры, для которых нужна помощь других людей или решение руководителя.
  - title: Договорённости после синка
    format: list
    instruction: Решения и задачи, появившиеся в ходе синка (например, «созвониться отдельно по …»).
