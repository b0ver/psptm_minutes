id: meeting_notes
name: Конспект встречи
description: Стандартные минутки — саммари, темы, решения, задачи. Аналог шаблона «Обычная встреча» в mymeet.ai и «Standard Meeting Notes» в Meetily.
when_to_use: Универсальный шаблон для внутренних рабочих встреч.
sections:
  - title: Краткое содержание
    format: paragraph
    instruction: Один абзац (4–6 предложений) — цель встречи, ход, результат.
  - title: Саммари по темам
    format: list
    instruction: >
      Для каждой темы — жирный заголовок с таймкодом начала, под ним 2–4 подпункта с конкретикой:
      что обсуждали, какие аргументы и цифры прозвучали, к чему пришли.
  - title: Решения
    format: list
    instruction: Принятые решения с обоснованием (если прозвучало) и таймкодом. Предложения без согласия сюда не входят.
  - title: Задачи
    format: table
    columns: ["Исполнитель", "Задача", "Срок", "Таймкод"]
    instruction: Задачи со статусом «назначено» и «взято_на_себя».
  - title: Открытые вопросы и риски
    format: list
    instruction: Нерешённые вопросы и озвученные риски, у кого они на контроле, если это прозвучало.
