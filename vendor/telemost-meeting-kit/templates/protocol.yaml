id: protocol
name: Протокол совещания
description: Формальный протокол в принятом в российских компаниях формате «Слушали — Выступили — Решили — Поручено».
when_to_use: Официальные совещания, планёрки руководства, встречи с подрядчиками и заказчиками, где нужен документ.
sections:
  - title: Реквизиты
    format: list
    instruction: Дата встречи, название, формат (видеовстреча, Яндекс Телемост), продолжительность, если известна.
  - title: Присутствовали
    format: list
    instruction: Участники с ролями, если они известны. Неопознанных спикеров не перечислять, указать их количество одной строкой.
  - title: Повестка
    format: list
    instruction: Нумерованные вопросы повестки — по темам встречи в хронологическом порядке, формулировка «О …» (например, «О сроках запуска рекламной кампании»).
  - title: Ход обсуждения
    format: paragraph
    instruction: >
      Для каждого вопроса повестки — подраздел «### N. О …» с тремя блоками:
      **Слушали:** кто докладывал и суть доклада (1–3 предложения);
      **Выступили:** кто и с какой позицией (кратко, по одному предложению на человека);
      **Решили:** принятые решения по вопросу (только статус «принято»). Если решения нет — «Решение не принято, вопрос перенесён» или «Принято к сведению».
  - title: Поручения
    format: table
    columns: ["№", "Поручение", "Ответственный", "Срок"]
    instruction: Все задачи со статусом «назначено» и «взято_на_себя». Формулировка поручения — официальная, в инфинитиве («Подготовить…», «Направить…»).
  - title: Открытые вопросы
    format: list
    instruction: Вопросы, вынесенные на следующее совещание или требующие уточнения.
