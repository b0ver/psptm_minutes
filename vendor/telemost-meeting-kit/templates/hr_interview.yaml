id: hr_interview
name: Собеседование
description: Структурированные итоги интервью с кандидатом (как «HR интервью» в mymeet.ai).
when_to_use: Собеседования, скрининги, технические интервью.
sections:
  - title: Кандидат
    format: list
    instruction: Позиция, текущее место и роль, опыт, образование — только то, что прозвучало.
  - title: Опыт и проекты
    format: list
    instruction: Ключевые проекты и достижения кандидата с конкретикой (цифры, роль, результат).
  - title: Навыки
    format: table
    columns: ["Навык", "Что показал / рассказал", "Таймкод"]
    instruction: Навыки, которые проверялись или упоминались, с подтверждением из ответов.
  - title: Ответы на ключевые вопросы
    format: list
    instruction: Вопрос интервьюера — краткая суть ответа кандидата.
  - title: Ожидания кандидата
    format: list
    instruction: Зарплата, формат работы, сроки выхода, мотивация смены работы — если обсуждались.
  - title: Вопросы кандидата
    format: list
    instruction: Что спрашивал кандидат о компании и роли.
  - title: Сильные стороны и зоны внимания
    format: list
    instruction: >
      Только наблюдения, прямо подкреплённые ответами, с таймкодами. Без итоговой оценки «брать / не брать» —
      решение принимает интервьюер.
  - title: Следующие шаги
    format: list
    instruction: Что пообещали кандидату и сроки обратной связи.
