id: chapters
name: Оглавление записи
description: Главы встречи с таймкодами для навигации по видео — как outline в Fireflies и главы в mymeet.ai.
when_to_use: Длинные встречи (от 30 минут), записи, которые будут пересматривать.
sections:
  - title: Главы
    format: table
    columns: ["Время", "Глава", "О чём"]
    instruction: По одной строке на тему в хронологическом порядке. «Глава» — 3–7 слов, «О чём» — одно предложение.
  - title: Ключевые моменты
    format: list
    instruction: 3–7 моментов, ради которых стоит открыть запись (решения, важные цифры, спор), — таймкод и одно предложение.
