id: one_on_one
name: Встреча один-на-один
description: 1:1 руководителя и сотрудника или партнёров.
when_to_use: Встречи двух человек про работу, развитие, обратную связь.
sections:
  - title: Темы встречи
    format: list
    instruction: О чём говорили — по одной строке на тему с таймкодом.
  - title: Состояние и загрузка
    format: list
    instruction: Что человек сказал о своей загрузке, мотивации, сложностях — только прозвучавшее, без интерпретаций настроения.
  - title: Обратная связь
    format: list
    instruction: Обратная связь в обе стороны — кто кому и что сказал.
  - title: Развитие и цели
    format: list
    instruction: Обсуждавшиеся цели, навыки, карьерные шаги.
  - title: Договорённости
    format: table
    columns: ["Кто", "Что", "Срок"]
    instruction: Задачи и обязательства обеих сторон.
  - title: К следующей встрече
    format: list
    instruction: Что обещали вернуть к обсуждению в следующий раз.
