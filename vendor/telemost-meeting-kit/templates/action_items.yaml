id: action_items
name: Поручения и задачи
description: Полный реестр задач, готовый к переносу в таск-трекер (Яндекс Трекер, monday.com, Битрикс24 и т.п.).
when_to_use: Любая встреча. Генерируется всегда.
sections:
  - title: Задачи
    format: table
    columns: ["№", "Задача", "Исполнитель", "Срок", "Тип", "Основание", "Таймкод"]
    instruction: >
      Все action_items со статусом «назначено» и «взято_на_себя».
      Задача начинается с глагола. Срок — дата (ДД.ММ.ГГГГ) и в скобках исходная формулировка, если она была относительной.
      «Основание» — короткая дословная цитата из evidence. Сортировка по сроку, задачи без срока — в конце.
  - title: По исполнителям
    format: list
    instruction: Для каждого исполнителя — его задачи одной строкой со сроками. Удобно разослать людям персонально.
  - title: Требуют уточнения
    format: table
    columns: ["Задача", "Чего не хватает", "Таймкод"]
    instruction: >
      Задачи без исполнителя, без срока, с низкой уверенностью (confidence = low) или с типом «предложено» (прозвучало, но никто не взял).
      В колонке «Чего не хватает» — «исполнитель», «срок», «согласие» и т.п. Это список для разбора с организатором.
