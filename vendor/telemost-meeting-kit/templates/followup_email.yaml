id: followup_email
name: Письмо по итогам
description: Готовое follow-up письмо участникам или клиенту.
when_to_use: Встречи с клиентами и партнёрами, внутренние встречи, итоги которых надо разослать.
sections:
  - title: Тема письма
    format: string
    instruction: "Формат: «Итоги встречи <дата> — <главное в 3–6 словах>»."
  - title: Текст письма
    format: paragraph
    instruction: >
      Вежливое деловое письмо от лица организатора: благодарность за встречу (1 предложение),
      ключевые договорённости списком, задачи с ответственными и сроками списком,
      следующий шаг или дата следующей встречи, если обсуждалась. Без таймкодов.
      Не больше 200 слов. Подпись — «[Имя]».
