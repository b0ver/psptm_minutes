id: project_sync
name: Статус проекта
description: Проектная встреча — статусы по направлениям, вехи, риски. Близко к шаблону Project Sync в Meetily и «Менеджмент» в mymeet.ai.
when_to_use: Еженедельные статусы проектов, встречи с подрядчиками, планирование.
sections:
  - title: Сводка прогресса
    format: paragraph
    instruction: Что сдвинулось с прошлой встречи, общее состояние проекта — 3–5 предложений.
  - title: Статус по направлениям
    format: table
    columns: ["Направление / этап", "Статус", "Ответственный", "Срок / ETA", "Комментарий"]
    instruction: По каждому направлению, этапу или подпроекту, который упоминался. Статус — «в срок», «есть риск», «отстаёт», «готово», «не начато» — только если это следует из сказанного.
  - title: Риски и блокеры
    format: table
    columns: ["Риск", "Влияние", "Что делаем", "Ответственный"]
    instruction: Озвученные риски и блокеры. Влияние — как его описали участники (сроки, деньги, качество).
  - title: Решения
    format: list
    instruction: Принятые решения с обоснованием и таймкодом.
  - title: Задачи
    format: table
    columns: ["Исполнитель", "Задача", "Срок"]
    instruction: Все назначенные и взятые на себя задачи.
  - title: Вопросы к следующей встрече
    format: list
    instruction: Что нужно проверить или принести на следующий синк.
