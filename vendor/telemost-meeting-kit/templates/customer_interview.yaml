id: customer_interview
name: Интервью с пользователем
description: Custdev / UX-интервью по логике Jobs To Be Done — контекст, боли, цитаты, инсайты, гипотезы (как UX interview в mymeet.ai).
when_to_use: Исследовательские интервью с клиентами и пользователями, проблемные интервью, тестирование гипотез.
sections:
  - title: Респондент
    format: list
    instruction: Кто это (роль, компания, опыт) — только то, что прозвучало.
  - title: Контекст и задача (Job)
    format: paragraph
    instruction: В какой ситуации человек сталкивается с задачей, чего хочет добиться, как решает сейчас.
  - title: Боли
    format: table
    columns: ["Боль", "Насколько сильная (со слов)", "Цитата", "Таймкод"]
    instruction: Проблемы и неудобства, которые респондент описал. Силу оценивай по его словам и примерам, а не по своему мнению.
  - title: Текущие решения и обходные пути
    format: list
    instruction: Чем пользуется сейчас, за что платит, какие костыли придумал.
  - title: Цитаты
    format: list
    instruction: 5–10 дословных цитат — самые яркие высказывания о проблеме и ожиданиях, с таймкодами.
  - title: Инсайты
    format: list
    instruction: Выводы, прямо подкреплённые словами респондента. После каждого — ссылка на таймкод-основание.
  - title: Гипотезы к проверке
    format: list
    instruction: Какие гипотезы подтвердились, опроверглись или появились — только если это прямо следует из ответов.
  - title: Позитивное и негативное
    format: list
    instruction: Что респонденту понравилось и не понравилось (если показывали продукт или прототип).
