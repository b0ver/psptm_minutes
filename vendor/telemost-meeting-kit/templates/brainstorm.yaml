id: brainstorm
name: Брейншторм
description: Итоги мозгового штурма — все идеи, кластеры, отобранное, что проверяем.
when_to_use: Генерация идей, стратсессии, обсуждение вариантов решения.
sections:
  - title: Вопрос сессии
    format: string
    instruction: Какую задачу или вопрос решали — одной фразой.
  - title: Все идеи по группам
    format: list
    instruction: >
      Все прозвучавшие идеи, сгруппированные по смыслу. Для каждой группы — жирный заголовок,
      под ним идеи с автором. Не отбрасывай идеи, даже если их раскритиковали.
  - title: Отобранные идеи
    format: table
    columns: ["Идея", "Почему выбрали", "Что дальше"]
    instruction: Идеи, которые участники решили развивать, и аргументы «за».
  - title: Отклонённые идеи
    format: list
    instruction: Отклонённые идеи и прозвучавшая причина.
  - title: Задачи
    format: table
    columns: ["Исполнитель", "Задача", "Срок"]
    instruction: Кто и что проверяет или прорабатывает.
