id: lecture_notes
name: Конспект выступления
description: Конспект доклада, лекции, вебинара или обучающей встречи (как «Конспект» в mymeet.ai, Fabric summarize_lecture).
when_to_use: Записи, где в основном говорит один спикер и передаёт знания.
sections:
  - title: О чём
    format: paragraph
    instruction: Тема, спикер, главная мысль — 2–3 предложения.
  - title: Конспект по разделам
    format: list
    instruction: >
      Для каждой темы — жирный заголовок с таймкодом и 3–6 тезисов с конкретикой: определения, шаги, примеры, цифры.
  - title: Термины
    format: table
    columns: ["Термин", "Объяснение спикера"]
    instruction: Термины и понятия, которые спикер объяснял.
  - title: Практические рекомендации
    format: list
    instruction: Советы, приёмы и инструменты, которые спикер рекомендовал применять.
  - title: Ссылки и материалы
    format: list
    instruction: Упомянутые книги, сервисы, статьи, люди.
  - title: Вопросы из зала
    format: list
    instruction: Вопросы слушателей и суть ответов.
