id: key_meanings
name: Основные смыслы
description: Не «что делать», а «что поняли». Идеи, инсайты, позиции, разногласия, показательные цитаты. Логика близка к Fabric extract_wisdom.
when_to_use: Стратегические сессии, брейнштормы, обсуждения продукта, интервью, встречи-размышления, лекции.
sections:
  - title: Главная мысль
    format: string
    instruction: Одно предложение до 25 слов — самая важная мысль или вывод встречи.
  - title: Ключевые смыслы
    format: list
    instruction: >
      5–10 главных идей и выводов, к которым пришли участники. Формулируй как утверждение, а не как тему
      («Клиенты уходят из-за сложного онбординга», а не «Обсудили онбординг»). Указывай, кто сформулировал, и таймкод.
  - title: Инсайты и неочевидное
    format: list
    instruction: >
      Мысли, которые меняют понимание ситуации: неожиданные факты, сдвиги позиций, связи между темами.
      Только то, что прямо прозвучало; не интерпретируй за участников. Если таких нет — «Не обсуждалось.»
  - title: Позиции и разногласия
    format: list
    instruction: По каждому спорному вопросу — суть спора, позиции участников (кто — что), чем закончилось.
  - title: Идеи на потом
    format: list
    instruction: Идеи и предложения, которые прозвучали, но не стали решениями.
  - title: Цитаты
    format: list
    instruction: 3–7 дословных цитат, которые лучше всего передают суть встречи — с автором и таймкодом.
  - title: Цифры и факты
    format: list
    instruction: Все значимые цифры и факты с контекстом.
