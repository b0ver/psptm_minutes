id: tldr
name: Коротко о встрече
description: Выжимка на 1 экран для тех, кто не был на встрече или хочет быстро вспомнить итог.
when_to_use: Любая встреча. Генерируется всегда.
sections:
  - title: В двух словах
    format: paragraph
    instruction: 2–3 предложения — зачем собирались и чем закончилось. Без перечисления всех тем.
  - title: Главное
    format: list
    instruction: 3–5 самых важных итогов встречи (решения, договорённости, важные факты). Каждый пункт — одно предложение с конкретикой.
  - title: Что дальше
    format: list
    instruction: Ближайшие шаги — кто и что делает, срок. Не больше 5 пунктов, самые важные; полный список задач — в отдельном отчёте.
  - title: Что осталось открытым
    format: list
    instruction: До 3 нерешённых вопросов или рисков, которые требуют внимания.
