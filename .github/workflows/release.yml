name: Release alpha
on:
  workflow_dispatch:
    inputs:
      candidate_only:
        description: Build an unaccepted RC bundle without staging or production deployment
        type: boolean
        default: false
      candidate_tag:
        description: Existing draft release for the unaccepted bundle
        type: string
        default: main-2026.11.19-rc.1
permissions:
  contents: read
concurrency:
  group: alpha-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.candidate_only || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      runtime: ${{ steps.images.outputs.runtime }}
      gpu: ${{ steps.images.outputs.gpu }}
      telemost: ${{ steps.images.outputs.telemost }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test exact release source
        run: |
          docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
          docker run --rm --network none --read-only --tmpfs /tmp:size=256m --cpus .5 --memory 512m --cap-drop ALL --security-opt no-new-privileges --entrypoint python \
            -v "$PWD/release/main-20261119/restore-tools:/next:ro" \
            -v "$PWD/release/main-20261119/restore-tools:/writer-code:ro" -w /next \
            psptm-minutes-tests-tests -m unittest test_next test_restore_controller test_smoke test_restore_safety_new
          docker run --rm --network none --read-only --tmpfs /tmp:size=64m,mode=1777 --cpus .5 --memory 128m --cap-drop ALL --security-opt no-new-privileges --entrypoint python \
            -v "$PWD/release/main-20261119:/proof:ro" -w /proof \
            psptm-minutes-tests-tests -m unittest test_install_os
          python3 scripts/ops/capacity_inspect_probe.py psptm-minutes-tests-tests
          python3 -m unittest discover -s benchmarks/tests -v
          bash -n scripts/ops/deploy.sh
          bash -n scripts/ops/restore-drill.sh
          bash -n scripts/ops/staging-smoke-drill.sh
          bash scripts/ops/staging-smoke-drill.sh
          bash scripts/ops/restore-drill.sh
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
      - name: Security gate
        run: |
          docker run --rm --user root --entrypoint sh psptm-minutes-tests-tests -c \
            'pip install --quiet pip-audit==2.9.0 && pip-audit --no-deps --disable-pip -r /app/requirements.lock && pip-audit --no-deps --disable-pip -r /app/integrations/telemost/requirements.lock'
      - name: Authenticate registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish three images
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="ghcr.io/${REPOSITORY,,}-rc"
          owner="${REPOSITORY%%/*}"
          package="${REPOSITORY##*/}"
          for kind in runtime gpu telemost; do
            test "$(gh api "/users/$owner/packages/container/$package-rc-$kind" --jq .visibility)" = private
          done
          for kind in runtime gpu telemost; do
            ref="$base-$kind:$GITHUB_SHA"
            if [ "$kind" = telemost ]; then
              docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" -f integrations/telemost/Dockerfile -t "$ref" .
            else
              docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" --target "$kind" -t "$ref" .
            fi
            if [ "$kind" = telemost ]; then
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python recording_controls_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python lifecycle_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python rollover_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python checkpoint_scope_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python browser_session_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python observer_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges --cpus 1 --memory 1500m "$ref" python watchdog_run_probe.py
              docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges "$ref" python probe.py
            fi
            docker run --rm --network none --read-only --tmpfs /tmp:size=256m,mode=1777 --shm-size=512m --cap-drop=ALL --security-opt=no-new-privileges --cpus 2 --memory 2g \
              -v "$PWD/release/main-20261119/surface_probe.py:/surface_probe.py:ro" \
              --entrypoint python "$ref" /surface_probe.py "$kind"
            docker push "$ref"
            test "$(gh api "/users/$owner/packages/container/$package-rc-$kind" --jq .visibility)" = private
            digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")
            echo "$kind=$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Cleanup
        if: always()
        run: |
          docker logout ghcr.io
          docker compose -f compose.test.yaml down --volumes
  candidate:
    if: inputs.candidate_only
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Save unaccepted immutable bundle in existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_RUNTIME: ${{ needs.build.outputs.runtime }}
          RELEASE_GPU: ${{ needs.build.outputs.gpu }}
          RELEASE_TELEMOST: ${{ needs.build.outputs.telemost }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          tag="$CANDIDATE_TAG"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,100}$ ]]
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          jq -n --arg sha "$GITHUB_SHA" --arg runtime "$RELEASE_RUNTIME" \
            --arg gpu "$RELEASE_GPU" --arg telemost "$RELEASE_TELEMOST" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{candidate_only:true,deploy_allowed:false,acceptance_complete:false,
              source_commit:$sha,platform:"linux/amd64",build_run:$run,
              registry_images:{runtime:$runtime,gpu:$gpu,telemost:$telemost}}' \
            > main-rc-bundle.json
          gh release upload "$tag" main-rc-bundle.json --clobber
  staging:
    if: ${{ !inputs.candidate_only }}
    needs: build
    runs-on: [self-hosted, linux, x64, minutes-staging]
    environment: alpha-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Deploy exact digests to staging
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          RELEASE_RUNTIME: ${{ needs.build.outputs.runtime }}
          RELEASE_GPU: ${{ needs.build.outputs.gpu }}
          RELEASE_TELEMOST: ${{ needs.build.outputs.telemost }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/ops/deploy.sh "$DEPLOY_ROOT" psptm-minutes-staging
  production:
    # Enable only after manifest acceptance, protected approval and staging rollback.
    if: ${{ !inputs.candidate_only && vars.ALPHA_PRODUCTION_DELIVERY_ENABLED == 'true' }}
    needs: [build, staging]
    runs-on: [self-hosted, linux, x64, minutes-production]
    environment: alpha-production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Promote the same digests after acceptance
        env:
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          RELEASE_RUNTIME: ${{ needs.build.outputs.runtime }}
          RELEASE_GPU: ${{ needs.build.outputs.gpu }}
          RELEASE_TELEMOST: ${{ needs.build.outputs.telemost }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/ops/deploy.sh "$DEPLOY_ROOT" psptm-minutes
